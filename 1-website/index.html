<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Day-by-day companion for the November 2026 Western Sichuan & Yunnan expedition.">
  <title>China Expedition · Nov 6–20, 2026</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231d1c1a'/><path d='M5 23l7-10 4 5 3-4 8 9z' fill='%23f6f3ee'/></svg>">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="China Expedition">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#itinerary"><b>China Expedition</b><span lang="zh">川 · 滇</span></a>
    <span class="brand-dates">6–20 Nov 2026</span>
  </header>

  <main>
    <section class="view" id="v-itinerary" aria-label="Itinerary"><div class="content"></div></section>
    <section class="view" id="v-timeline" aria-label="Timeline"><div class="content"></div></section>
    <section class="view" id="v-guide" aria-label="Guide"><div class="content"></div></section>
  </main>

  <!-- Expanded card: place, stay or day -->
  <article class="detail" id="detail" hidden></article>

  <!-- Phone: floating Guide + Filters -->
  <div class="fabs" id="fabs">
    <a class="fab" href="#guide" aria-label="Guide" data-icon="book-open"></a>
    <a class="fab" href="#timeline" aria-label="Timeline" data-icon="calendar-days"></a>
    <button class="fab" id="fabFilter" type="button" aria-label="Filter stops" aria-expanded="false" aria-controls="filterPanel" data-icon="sliders-horizontal"><span class="fab-dot" aria-hidden="true"></span></button>
    <div class="filter-panel" id="filterPanel" role="radiogroup" aria-label="Filter stops"></div>
  </div>

  <nav class="tabbar" aria-label="Sections">
    <a href="#itinerary" data-view="itinerary" data-icon="map"><span>Itinerary</span></a>
    <a href="#guide" data-view="guide" data-icon="book-open"><span>Guide</span></a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="icons.js"></script>
  <script src="data.js"></script>
  <script src="places.js"></script>
  <script src="destinations.js"></script>
  <script src="photos.js"></script>
  <script src="geo.js"></script>
  <script src="food.js"></script>
  <script src="storyboards.js"></script>
  <script src="light3d.js"></script>
  <script src="pronounce.js"></script>
  <script src="tickets.js"></script>
  <script src="app.js"></script>
  <script>
    // Offline copy (sw.js). Skipped where service workers aren't allowed.
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
